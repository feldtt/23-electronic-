# Decap CMS config. Admin lives at /admin/. Hand-maintained (not generated by import:mockup).
# Local-only: saves go to files on this computer through `npx decap-server` (port 8081).
# Nothing is published and there is no GitHub login.
backend:
  name: proxy
  proxy_url: http://localhost:8081/api/v1
  branch: main

logo_url: /assets/uploads/logo-23-electronic.png

# Uploaded photos land in the mockup (source of truth); import:mockup copies them to public/.
media_folder: mockup/toko-23/assets/uploads
public_folder: /assets/uploads

collections:
  - name: products
    label: Produk
    label_singular: Produk
    folder: content/products
    extension: json
    format: json
    create: true
    slug: "{{category}}-{{slug}}"
    description: "Klik produk untuk mengubah. Pakai Filter untuk satu kategori, Kelompokkan untuk melihat per kategori/jenis, Urutkan untuk mengurutkan."
    summary: "{{title}}  ·  {{group}}"
    sortable_fields: ["title", "category", "group", "order"]
    view_filters:
      - { label: "AC", field: category, pattern: "^ac$" }
      - { label: "Kulkas", field: category, pattern: "^kulkas$" }
      - { label: "Mesin Cuci", field: category, pattern: "^mesin-cuci$" }
      - { label: "TV & Elektronik", field: category, pattern: "^tv$" }
      - { label: "Belum ada foto", field: photo, pattern: "^$" }
      - { label: "Disembunyikan", field: published, pattern: false }
    view_groups:
      - { label: "Kategori", field: category }
      - { label: "Jenis / Sub-kategori", field: group }
      - { label: "Tampil / Disembunyikan", field: published }
    fields:
      - label: Kategori
        name: category
        widget: select
        options:
          - { label: AC, value: ac }
          - { label: Kulkas, value: kulkas }
          - { label: Mesin Cuci, value: mesin-cuci }
          - { label: TV & Elektronik Rumah, value: tv }
      - label: Jenis / Sub-kategori
        name: group
        widget: string
        required: false
        hint: "Judul bagian di halaman kategori, mis. 'Top Loading Otomatis (1 Tabung)'. Tulis persis sama dengan produk lain agar masuk bagian yang sama. Kosongkan untuk bagian utama."
      - label: Nama / Model
        name: title
        widget: string
      - label: Foto
        name: photo
        widget: image
        required: false
        hint: "Kosongkan jika belum ada foto (kartu menampilkan ikon)."
      - label: Teks alternatif foto
        name: alt
        widget: string
        required: false
        hint: "Deskripsi singkat foto. Kosong = pakai nama produk."
      - label: Deskripsi singkat
        name: description
        widget: text
        hint: "Satu baris di bawah nama, mis. 'AC split ½ PK · 350 W · R32'."
      - label: Pesan WhatsApp
        name: wa_message
        widget: text
        required: false
        hint: "Pesan otomatis saat pelanggan klik 'Tanya stok'. Kosong = pesan standar dengan nama produk."
      - label: Urutan
        name: order
        widget: number
        value_type: int
        default: 1000
        hint: "Angka kecil tampil lebih dulu. Produk baru default di paling akhir."
      - label: Tampilkan di website
        name: published
        widget: boolean
        default: true
